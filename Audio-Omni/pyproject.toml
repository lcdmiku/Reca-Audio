[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-omni"
version = "1.1.0"
description = "Audio-Omni: unified audio understanding, generation and editing (vendored fork with RecA post-training hooks)"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Zeyue Tian" }]
keywords = ["audio", "diffusion", "text-to-audio", "music-generation", "unified-multimodal-model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Generation",
]

dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "transformers>=4.56,<6",
    "accelerate>=1.0",
    "huggingface_hub>=0.26",
    "safetensors>=0.4",
    "einops>=0.7",
    "einops-exts>=0.0.4",
    "einx>=0.3",
    "omegaconf>=2.3",
    "timm>=1.0",
    "packaging>=23",
    "requests>=2.31",
    "tqdm>=4.66",
    "Pillow>=10",
    "matplotlib>=3.8",
    "PyWavelets>=1.4",
    "librosa>=0.10",
    "soundfile>=0.12",
    "torchlibrosa>=0.1",
    "pyloudnorm>=0.1",
    "pedalboard>=0.9",
    "jieba>=0.42",
    "pypinyin>=0.51",
    "k-diffusion>=0.1.1",
    "torchdiffeq>=0.2.3",
    "torchsde>=0.2.6",
    "v-diffusion-pytorch>=0.0.2",
    "vector-quantize-pytorch>=1.14",
    "x-transformers>=1.26",
    "descript-audio-codec>=1.0",
    "descript-audiotools>=0.7",
    "alias-free-torch>=0.0.6",
    "auraloss>=0.4",
    "torch-stoi>=0.2",
    "julius>=0.2",
    "qwen-omni-utils>=0.0.9",
]

[project.optional-dependencies]
# 视频驱动（V2A/V2M）与同步特征
video = [
    "decord>=0.6",
    "av>=12",
    "mmaudio @ git+https://github.com/hkchengrex/MMAudio.git@974010a026c731054592d8f777218bd9d85a6c24",
]
# Gradio demo
demo = ["gradio>=5.0"]
# 训练 / 后训练
train = [
    "ema-pytorch>=0.7",
    "tensorboard>=2.16",
    "wandb>=0.17",
    "webdataset>=0.2",
    "pytorch-lightning>=2.2",
]
# 可选的音频编解码器（部分 autoencoder 分支使用）
codecs = ["encodec>=0.1.1", "audiocraft>=1.3"]
dev = ["ruff>=0.6", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/ZeyueT/Audio-Omni"
Paper = "https://arxiv.org/abs/2604.10708"
Model = "https://huggingface.co/HKUSTAudio/Audio-Omni"
Dataset = "https://huggingface.co/datasets/HKUSTAudio/AudioEdit"

[tool.setuptools.packages.find]
include = ["audio_omni*"]

[tool.setuptools.package-data]
audio_omni = ["data/vocab.txt"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
