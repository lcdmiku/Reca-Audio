fireredtts3-voice-clone-english:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      prompt_audio: "{{WavPath}}"
      prompt_text: "{{prompt_text}}"
      language: "English"

fireredtts3-voice-clone-chinese:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      prompt_audio: "{{WavPath}}"
      prompt_text: "{{prompt_text}}"
      language: "Chinese"

# Generalization of the -english/-chinese prompts to the remaining languages in
# FireRedTTS3's 24-language tag set (fireredtts3/utils/text_tokenizer.py
# MULTI_LANG_TAGS), covering the multilingual benchmarks minimax_tts_* and
# cv3_zero_shot_*. Only `language` differs between prompts; the value is the
# bare capitalized name the upstream frontend compares against, not the
# <|Tag|> form. Passing it explicitly avoids upstream fastText auto-detection,
# which needs a lid.176.ftz download the eval image does not carry.

fireredtts3-voice-clone-arabic:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      prompt_audio: "{{WavPath}}"
      prompt_text: "{{prompt_text}}"
      language: "Arabic"

